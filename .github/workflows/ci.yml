name: CI · Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

      - name: Inspect output
        run: |
          echo "=== dist/ contents ==="
          ls -la dist/
          echo ""
          echo "=== dist size ==="
          du -sh dist/
          echo ""
          echo "=== index.html base check ==="
          grep -o '/esi/assets/[^"]*' dist/index.html | head -5
          if grep -q '/esi/assets/' dist/index.html; then
            echo "✓ base path /esi/ correctly applied"
          else
            echo "✗ base path missing"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
